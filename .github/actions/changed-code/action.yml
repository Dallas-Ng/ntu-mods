name: Detect code changes
description: >
  Sets `code` to false when every changed file is documentation, so workflows
  can skip their heavy steps (the job still runs and reports success, which
  keeps required status checks satisfied; `paths-ignore` would leave them
  pending). Defaults to true whenever the diff cannot be determined.
  Needs the repo checked out; content/ is code because articles are built
  into the SEO-tested pages.

outputs:
  code:
    description: "'true' unless the change is docs-only"
    value: ${{ steps.diff.outputs.code }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=true
        if [ -n "$BASE" ] && [ "${BASE//0/}" != "" ] && git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
          files=$(git diff --name-only "$BASE" HEAD || true)
          if [ -n "$files" ]; then
            code=false
            while read -r f; do
              case "$f" in
                content/*) code=true ;;
                docs/* | .claude/* | .github/FUNDING.yml | .github/ISSUE_TEMPLATE/* | *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "code changes: $code"

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Lint and typecheck
        run: yarn lint

      # Catches broken routes, bad getStaticPaths and adapter/config problems
      # before they reach a Cloudflare deploy.
      - name: Build
        run: yarn build

name: E2E SEO Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main] # seeds the caches so PRs hit them

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR pushes; never cancel main, its runs seed the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-seo:
    name: E2E SEO tests (Playwright)
    # Drafts wait for ready_for_review. A skipped job satisfies required checks.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is migrating to 26, move deliberately
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Detect code changes
        id: changes
        uses: ./.github/actions/changed-code

      - name: Set up Node and dependencies
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-deps

      # Browser binaries are keyed on the Playwright version; system libs are
      # not cacheable, so install-deps still runs on a hit. Headless shell only:
      # the tests never run headed, and it is a much smaller download.
      - name: Get Playwright version
        if: steps.changes.outputs.code == 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.changes.outputs.code == 'true'
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.changes.outputs.code == 'true'
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      # Independent of each other (build writes dist/, seed writes
      # .wrangler/state), so run them side by side.
      - name: Build site and seed local D1
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm build & build=$!
          pnpm db:seed-local & seed=$!
          wait $build && wait $seed

      - name: Run E2E SEO tests
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: E2E SEO Tests

on:
  pull_request:
  push:
    branches: [main] # seeds the caches so PRs hit them

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-seo:
    name: E2E SEO tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-deps

      # Browser binaries are keyed on the Playwright version; system libs are
      # not cacheable, so install-deps still runs on a hit. Headless shell only:
      # the tests never run headed, and it is a much smaller download.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      # Independent of each other (build writes dist/, seed writes
      # .wrangler/state), so run them side by side.
      - name: Build site and seed local D1
        run: |
          yarn build & build=$!
          yarn db:seed-local & seed=$!
          wait $build && wait $seed

      - name: Run E2E SEO tests
        run: yarn test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: SEO E2E

on:
  pull_request:
  push:
    branches: [main] # seeds the node_modules / browser caches so PRs hit them

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: Browser SEO checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false # we cache node_modules instead

      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'yarn.lock') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline --ignore-scripts

      # Browser binaries are keyed on the Playwright version; system libs are
      # not cacheable, so --with-deps still runs on a hit (deps only, fast).
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build site
        run: yarn build

      - name: Seed local D1
        run: yarn db:seed-local

      - name: Run SEO tests
        run: yarn test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

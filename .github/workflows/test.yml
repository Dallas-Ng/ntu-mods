name: Unit Tests

on:
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Run Vitest suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false # setup-node auto-caches yarn from packageManager; we cache node_modules instead

      # Tests run in ~1s; install dominates. Cache node_modules itself so a
      # lockfile-unchanged PR skips install entirely.
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'yarn.lock') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run tests
        run: yarn test

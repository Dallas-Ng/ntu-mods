name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main] # seeds the caches so PRs hit them

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR pushes; never cancel main, its runs seed the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Vitest)
    # Drafts wait for ready_for_review. A skipped job satisfies required checks.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is migrating to 26, move deliberately
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Detect code changes
        id: changes
        uses: ./.github/actions/changed-code

      - name: Set up Node and dependencies
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-deps

      - name: Run unit tests
        if: steps.changes.outputs.code == 'true'
        run: pnpm test
